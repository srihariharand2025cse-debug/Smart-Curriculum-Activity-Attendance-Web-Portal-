# ===================================================================
# Development Profile (H2 In-Memory Database for Standalone/Demo Runs)
# ===================================================================
spring.application.name=portal-dev
server.port=8080

# H2 In-Memory DataSource
spring.datasource.url=jdbc:h2:mem:smart_curriculum_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings for Dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Seed initial demo dataset
portal.seed-data=true
