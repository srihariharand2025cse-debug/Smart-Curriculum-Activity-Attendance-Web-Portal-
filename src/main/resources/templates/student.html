<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Smart Curriculum Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header-card">
            <span class="badge">✓ Day 13 – Student Dashboard</span>
            <h1 class="portal-title">Student Dashboard</h1>
            <p class="portal-subtitle">Overview of attendance, activities and quick links.</p>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="stat-label">Attendance %</div>
                <div class="stat-value">92%</div>
            </div>
            <div class="dashboard-card">
                <div class="stat-label">Upcoming Activities</div>
                <ul class="list-unstyled">
                    <li>Workshop on AI – 12 Oct</li>
                    <li>Sports Day – 20 Oct</li>
                </ul>
            </div>
            <div class="dashboard-card">
                <div class="stat-label">Quick API Links</div>
                <div class="api-links">
                    <a class="api-link-btn" href="/api/students" target="_blank">📓 Student List</a>
                    <a class="api-link-btn" href="/api/attendance/summary" target="_blank">📊 Attendance Summary</a>
                    <a class="api-link-btn" href="/api/activities" target="_blank">📅 Activities</a>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
