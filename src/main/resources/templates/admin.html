<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Curriculum Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header-card">
            <span class="badge">✓ Day 13 – Admin Dashboard</span>
            <h1 class="portal-title">Admin Dashboard</h1>
            <p class="portal-subtitle">Overview of system-wide statistics and management shortcuts.</p>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="stat-label">Total Students</div>
                <div class="stat-value" id="total-students">—</div>
            </div>
            <div class="dashboard-card">
                <div class="stat-label">Total Faculty</div>
                <div class="stat-value" id="total-faculty">—</div>
            </div>
            <div class="dashboard-card">
                <div class="stat-label">Activities</div>
                <div class="stat-value" id="total-activities">—</div>
            </div>
            <div class="dashboard-card">
                <div class="stat-label">Attendance Records</div>
                <div class="stat-value" id="total-attendance">—</div>
            </div>
            <div class="dashboard-card">
                <div class="stat-label">Management Links</div>
                <div class="api-links">
                    <a class="api-link-btn" href="/api/students" target="_blank">📓 Students</a>
                    <a class="api-link-btn" href="/api/faculty" target="_blank">👨‍🏫 Faculty</a>
                    <a class="api-link-btn" href="/api/activities" target="_blank">📅 Activities</a>
                    <a class="api-link-btn" href="/api/attendance" target="_blank">📊 Attendance</a>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
